  <g fill="none" stroke="#4e8a34" stroke-width="3" stroke-linecap="round" opacity="0.55">
    <path d="M520 300 C 700 310 860 262 1200 272"/>
    <path d="M470 318 C 680 330 860 285 1200 296"/>
    <path d="M420 338 C 660 352 860 310 1200 322"/>
