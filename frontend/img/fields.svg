  </g>

  <!-- foreground hill -->
  <path d="M0 360 C 160 325 330 330 470 352 C 560 366 620 392 700 420 L0 420 Z" fill="url(#near)"/>

  <!-- trees -->
  <g>
    <rect x="1053" y="230" width="6" height="34" rx="2" fill="#3b2a1a" opacity="0.8"/>
    <ellipse cx="1056" cy="222" rx="26" ry="20" fill="#2e7a3a"/>
    <ellipse cx="1046" cy="214" rx="14" ry="11" fill="#3f9149"/>
    <rect x="1113" y="238" width="5" height="26" rx="2" fill="#3b2a1a" opacity="0.8"/>
    <ellipse cx="1115" cy="232" rx="18" ry="14" fill="#2e7a3a"/>
    <rect x="808" y="226" width="5" height="26" rx="2" fill="#3b2a1a" opacity="0.7"/>
