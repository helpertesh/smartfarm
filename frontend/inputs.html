<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SmartFarm · Farm inputs</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="inputs">
  <div class="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
      <div class="topbar">
        <div>
          <div class="toolbar"><button class="btn secondary sm menu-btn" id="menuBtn">☰</button><h1>Farm inputs</h1></div>
          <div class="sub">Keep track of seed, fertilizer and chemicals in store. You get an alert when something runs low.</div>
        </div>
        <div class="toolbar" id="farmPicker"></div>
      </div>

      <div class="grid cols-3" id="stats"></div>

      <div class="card" style="margin-top:18px">
        <div class="card-head"><h2>In store</h2></div>
        <div id="msg" class="notice hidden"></div>
        <div id="list"></div>
      </div>

      <div class="card" style="margin-top:18px">
        <div class="card-head"><h2>Add an input</h2></div>
        <div id="addMsg" class="notice hidden"></div>
        <form id="addForm">
          <div class="form-row">
            <div class="field"><label>Name</label><input name="name" required minlength="2" placeholder="e.g. DAP fertilizer" /></div>
            <div class="field"><label>Category</label><select name="category" id="catSel"></select></div>
          </div>
          <div class="form-row">
            <div class="field"><label>Quantity in store</label><input name="quantity" type="number" min="0" step="0.1" required /></div>
            <div class="field"><label>Unit</label><select name="unit" id="unitSel"></select></div>
            <div class="field"><label>Alert me when at or below</label><input name="reorder_level" type="number" min="0" step="0.1" value="10" required /></div>
          </div>
          <button class="btn" type="submit">Add input</button>
        </form>
      </div>
    </main>
  </div>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/inputs.js"></script>
</body>
</html>
