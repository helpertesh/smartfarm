<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SmartFarm · Crop advisory</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="advisory">
  <div class="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
      <div class="topbar">
        <div>
          <div class="toolbar"><button class="btn secondary sm menu-btn" id="menuBtn">☰</button><h1>Crop advisory</h1></div>
          <div class="sub">Tell us about your land and we will rank the crops most likely to do well.</div>
        </div>
      </div>

      <div class="grid cols-3">
        <div class="card">
          <h2>Your conditions</h2>
          <form id="advForm">
            <div class="field"><label>Use a saved farm</label><select id="farmSel"><option value="">— enter manually —</option></select></div>
            <div class="field"><label>Soil type</label><select name="soil_type" id="soilSel"></select></div>
            <div class="field"><label>Season</label><select name="season" id="seasonSel"></select></div>
            <div class="field"><label>Water source</label><select name="water_source" id="waterSel"></select></div>
            <div class="form-row">
              <div class="field"><label>Farm size (acres)</label><input name="farm_size_acres" type="number" step="0.1" min="0.1" value="1" /></div>
              <div class="field"><label>Altitude (m, optional)</label><input name="altitude_m" type="number" step="1" placeholder="e.g. 1800" /></div>
            </div>
            <button class="btn block" type="submit">Recommend crops</button>
          </form>
        </div>
        <div class="card span-2">
          <div class="card-head"><h2>Recommended crops</h2><span class="tiny" id="ctx"></span></div>
          <div id="results"><div class="empty">Fill in your conditions to see recommendations.</div></div>
        </div>
      </div>

      <div class="card" style="margin-top:18px">
        <div class="card-head"><h2>Crop library</h2></div>
        <div id="library" class="grid cols-4"></div>
      </div>
    </main>
  </div>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/advisory.js"></script>
</body>
</html>
