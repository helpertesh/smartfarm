<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SmartFarm · Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="admin">
  <div class="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
      <div class="topbar">
        <div>
          <div class="toolbar"><button class="btn secondary sm menu-btn" id="menuBtn">☰</button><h1>Admin panel</h1></div>
          <div class="sub">Platform overview, user management and market price updates.</div>
        </div>
      </div>

      <div class="grid cols-4" id="stats"></div>

      <div class="grid cols-2" style="margin-top:18px">
        <div class="card">
          <div class="card-head"><h2>Update market price</h2></div>
          <div id="msg" class="notice hidden"></div>
          <form id="priceForm">
            <div class="form-row">
              <div class="field"><label>Crop</label><select name="crop_key" id="cropSel"></select></div>
              <div class="field"><label>Market</label><input name="market" list="marketList" required placeholder="e.g. Nairobi - Wakulima" /><datalist id="marketList"></datalist></div>
            </div>
            <div class="form-row">
              <div class="field"><label>Price (KSh/kg)</label><input name="price_per_kg" type="number" step="0.5" min="0.5" required /></div>
              <div class="field"><label>Date</label><input name="date" type="date" required /></div>
            </div>
            <button class="btn" type="submit">Save price</button>
          </form>
          <h3 style="margin-top:18px">Popular crops (active plans)</h3>
          <div id="popular"></div>
        </div>
        <div class="card">
          <div class="card-head"><h2>Users</h2></div>
          <div id="users"></div>
        </div>
      </div>
    </main>
  </div>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
